name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests projects
      - run: python -m pytest -q
      - name: SEC analyst, agentic copilot and text-to-SQL tests (scripted model, no LLM needed)
        env: { PYTHONPATH: src }
        run: |
          (cd projects/finance/sec-filing-analyst && python -m pytest -q test_analyst.py)
          (cd projects/core/agentic-rag-copilot && python -m pytest -q test_copilot.py)
          (cd projects/tech/text-to-sql && python -m pytest -q test_sqlagent.py)
          (cd projects/tech/llm-red-team && python -m pytest -q test_redteam.py)
          (cd projects/tech/movie-recommendations && python -m pytest -q test_recs.py)
          (cd projects/tech/agent-injection-guardrails && python -m pytest -q test_agent_guardrails.py)
          (cd projects/tech/rag-cost-dashboard && python -m pytest -q test_serving.py)
      - name: PII redaction unit tests
        run: |
          pip install spacy
          cd projects/core/pii-redaction && python -m pytest -q test_redact.py
      - name: Fraud scoring tests (real ULB data, committed model)
        run: |
          pip install xgboost
          cd projects/finance/realtime-fraud-scoring && python -m pytest -q test_fraud.py
          cd ../explainable-credit-risk && python -m pytest -q test_credit.py
          cd ../model-risk-checker && python -m pytest -q test_checks.py
          cd ../graph-aml && python -m pytest -q test_aml.py
      - name: ICD-10 coding tests (real CodiEsp data)
        run: cd projects/healthcare/icd10-coding-assistant && python -m pytest -q test_coder.py
      - name: Clinical LLM project tests (scripted model, real data)
        run: |
          python -m spacy download en_core_web_md
          (cd projects/healthcare/clinical-llm-safety-eval && python -m pytest -q test_clinical_eval.py)
          (cd projects/healthcare/clinical-note-summarizer && python -m pytest -q test_summarizer.py)
          (cd projects/healthcare/prior-auth-assistant && python -m pytest -q test_prior_auth.py)
          pip install openpyxl matplotlib
          (cd projects/healthcare/claim-denial-appeals && python -m pytest -q test_denials.py)
      - name: Motor pricing tests (real freMTPL2 data)
        run: |
          pip install pyreadr
          cd projects/insurance/motor-pricing-fairness && python -m pytest -q test_pricing.py
          cd ../claims-severity-large-loss && python -m pytest -q test_severity.py
          cd ../ai-governance-report && python -m pytest -q test_governance.py
          cd ../life-underwriting-risk && python -m pytest -q test_underwriting.py
          cd ../subrogation-detection && python -m pytest -q test_subro.py

  real-data-eval:
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,dense]"
      - name: Cache downloaded filings (bronze layer)
        uses: actions/cache@v4
        with:
          path: data/bronze
          key: bronze-financebench-v1
      - name: Pipeline on real FinanceBench filings
        run: python -m docpipe.run --scope eval
      - name: Retrieval evaluation (BM25, filters, expansion, dense, hybrid)
        run: python -m evalkit.run --dataset financebench --dense
      - name: Regression gate vs committed baseline
        run: python -m evalkit.gate --dataset financebench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/
            data/reports/
