# Claim denial appeals: draft appeal letters from the prior authorization checklist results with a
# free local model, score quotes and numbers against the record and policy; commit the results.
#
# Start it from the Actions tab, or by changing projects/healthcare/claim-denial-appeals/run-request.txt.
name: claim-appeal-eval

on:
  workflow_dispatch:
  push:
    paths: ["projects/healthcare/claim-denial-appeals/run-request.txt"]

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/src
  LLM_PROVIDER: ollama
  LLM_MODEL: qwen2.5:3b
  SHARDS: "5"

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - uses: actions/cache@v4
        with: { path: ~/.ollama/models, key: ollama-qwen2.5-3b }
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$LLM_MODEL"
      - name: Draft and score this shard
        working-directory: projects/healthcare/claim-denial-appeals
        run: python run_appeals.py --shard "${{ matrix.shard }}/$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ap-shard-${{ matrix.shard }}
          path: projects/healthcare/claim-denial-appeals/results/appeals_shard*.jsonl
          if-no-files-found: ignore

  merge:
    needs: draft
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with: { path: shards, pattern: "ap-shard-*", merge-multiple: true }
      - name: Merge shards and summarize
        working-directory: projects/healthcare/claim-denial-appeals
        run: |
          cp ../../../shards/*.jsonl results/
          python run_appeals.py --merge
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/healthcare/claim-denial-appeals/results/
          git commit -m "Claim appeal letter results (${LLM_MODEL}) [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
